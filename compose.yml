services:
  retriever:
    build:
      context: .
      dockerfile: apps/retriever/Dockerfile
    environment:
      APP_ROLE: retriever
      TERM: xterm-256color
      HISTORY_MESSAGES: 2
      MIN_SIMILARITIES: 2
      MAX_SIMILARITIES: 5
      COSINE_LIMIT: 0.55
      CHUNK_SIZE: 600
      CHUNK_OVERLAP: 100
      MAX_EMBEDDING_CHARS: 400
      PDF_MIN_EXTRACTED_CHARS: 100
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      OPTION_TEMPERATURE: 0.0
      OPTION_TOP_P: 0.9
      OPTION_PRESENCE_PENALTY: 2.2
      CONTENT_PATH: /app/data
      CHAT_HISTORY_DIR: /app/state/chat-history
      INDEX_STATE_FILE: /app/state/index-state.json
      EMBEDDING_STATUS_FILE: /app/state/embedding-status.json
      RETRIEVER_API_PORT: 3000
      BACKEND_API_PORT: 3100
      OCR_SCANNER_BASE_URL: http://127.0.0.1:3300
      AUDIO_TRANSCRIPTION_BASE_URL: http://127.0.0.1:3400
    volumes:
      - ./data:/app/data
      - ./upload:/app/upload
      - ./shared/prompts:/app/prompts:ro
      - ./users.json:/app/users.json:ro
      - rag_state:/app/state
    ports:
      - "3100:3100"
    models:
      chat-model:
        endpoint_var: MODEL_RUNNER_BASE_URL
        model_var: MODEL_RUNNER_LLM_CHAT
      embedding-model:
        endpoint_var: MODEL_RUNNER_BASE_URL
        model_var: MODEL_RUNNER_LLM_EMBEDDING
      audio-model:
        endpoint_var: MODEL_RUNNER_BASE_URL
        model_var: MODEL_RUNNER_LLM_AUDIO
    depends_on:
      qdrant:
        condition: service_started
      embedder:
        condition: service_started
      postgres:
        condition: service_healthy

  embedder:
    build:
      context: .
      dockerfile: apps/embedder/Dockerfile
    environment:
      APP_ROLE: embedder
      CONTENT_PATH: /app/data
      EMBED_INTERVAL_SECONDS: 15
      EMBEDDER_HEALTH_PORT: 3200
      CHUNK_SIZE: 600
      CHUNK_OVERLAP: 100
      MAX_EMBEDDING_CHARS: 400
      PDF_MIN_EXTRACTED_CHARS: 100
      INDEX_STATE_FILE: /app/state/index-state.json
      EMBEDDING_STATUS_FILE: /app/state/embedding-status.json
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      OCR_SCANNER_BASE_URL: http://127.0.0.1:3300
      AUDIO_TRANSCRIPTION_BASE_URL: http://127.0.0.1:3400
    volumes:
      - ./data:/app/data
      - ./upload:/app/upload
      - rag_state:/app/state
    models:
      embedding-model:
        endpoint_var: MODEL_RUNNER_BASE_URL
        model_var: MODEL_RUNNER_LLM_EMBEDDING
      audio-model:
        endpoint_var: MODEL_RUNNER_BASE_URL
        model_var: MODEL_RUNNER_LLM_AUDIO
    depends_on:
      qdrant:
        condition: service_started
      postgres:
        condition: service_healthy

  webui:
    build:
      context: ./apps/webui
      dockerfile: Dockerfile
    environment:
      UPSTREAM_API_URL: http://retriever:3100
    ports:
      - "5173:80"
    develop:
      watch:
        - action: sync
          path: ./apps/webui
          target: /usr/share/nginx/html
          initial_sync: true
          ignore:
            - Dockerfile
            - nginx.conf.template
            - package.json
            - package-lock.json
            - node_modules/
            - dist/
    depends_on:
      - retriever

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
  rag_state:
  postgres_data:

models:
  chat-model:
    model: hf.co/Qwen/Qwen2.5-Coder-3B-Instruct-GGUF:Q4_K_M
  embedding-model:
    model: ai/embeddinggemma:latest
  audio-model:
    model: hf.co/openai/whisper-small
